<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/apiFetch.js"></script>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="css/style_search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Search</title>
</head>
<body onload="search(), validarSessaoFilm()" class="search_main">
            <div class="button_line">
            <div id="left" class="left">
                <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
                <a href="Search.html"><button class="selected attached_button">Films</button></a>
<!--                 <a href="collection.html"><button class="attached_button">My Collection</button></a>
                <button class="attached_button">Dashboard</button> -->
            </div>
            <div class="right">
                <a href="login.html"><button class="basic_button"> Sign in </button></a>
                <a href="Create.html"><button class="create_account"> Create Account </button></a>
            </div>
            <input onkeyup="(event.key === 'Enter') ? search() : undefined;" type="text" id="ipt_filme" placeholder="Type your movie">
            </div>
        </div>
        <section class="center">
            <main class="movie_box" id="movie_box">
                <div class="poster_grid" id="msg">
                </div>
            </main>
        </section>

    <!-- <button onclick="buscar()">Procurar o Filme</button><br><br> -->
</body>
<script>
    function search(){
        var search = ipt_filme.value;

        fetch("/movies/pesquisar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          searchServer: search,
        })
      })

      .then((resposta) => {
        if (resposta.ok){
            resposta.json().then(json => {
            msg.innerHTML = '';
            for(let i = 0; i < json.length; i++){
                //idFilme, path, titulo, dt_lancamento
                let data = json[i].dt_lancamento
                console.log(data)
                console.log(':)')
                console.log(json[i].idFilme)
                msg.innerHTML += `<div class="movie_div" id="${json[i].idFilme}"> <img class="poster" src="https://image.tmdb.org/t/p/original/${json[i].path}"> <label class="movie_title">${json[i].titulo}</label> <label class="year">(${data.slice(0, 4)})</label> </div>`
            }
        })
        }
        else{
            console.log(':(')
            msg.innerHTML = `<div class="movie_div" id=""> <img class="poster"> <label class="movie_title">Nenhum filme encontrado...</label> <label class="year"></label> </div>`
        }
        })
      }
    
</script>
</html>
