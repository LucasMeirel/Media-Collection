<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style_search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Search</title>
</head>
<body class="search_main">
            <div class="button_line">
            <div class="left">
                <a href="index.html"><img class="logo" src="img\Logo v2.png" alt="logo"><a href="Home.html"></a>
                <a href="Search.html"><button class="attached_button">Films</button></a>
                <a href="collection.html"><button class="attached_button">My Collection</button></a>
                <button class="attached_button">Dashboard</button>
            </div>
            <div class="right">
                <a href="login.html"><button class="basic_button"> Sign in </button></a>
                <a href="Create.html"><button class="create_account"> Create Account </button></a>
            </div>
                <!-- <input onkeyup="(event.key === 'Enter') ? buscar() : undefined;" type="text" id="ipt_filme"> -->
            </div>
        <section class="center">
                <main class="login_box center">
                    <div class="tv_message center">
                        <label for=""> Track the dvd's you got. Save those you still want. </label>
                    </div>
                    <div class="cadastro">
                        <label>Welcome back!</label>
                            <section> E-mail: <br><input type="text" id="ipt_email" placeholder="E-mail"> </section>
                            <section> Password: <br><input type="text" id="ipt_password" placeholder="Password"> </section>
                            <div class="erro" id="error_message"></div>
                        <button class="signup" onclick="entrar()"> Sign In </button>
                    </div>
                </main>
        </section>

    <!-- <button onclick="buscar()">Procurar o Filme</button><br><br> -->
</body>
<script>
  function entrar() {
          var emailVar = ipt_email.value;
          var senhaVar = ipt_password.value;

          if (emailVar == "" || senhaVar == "") {
              error_message.innerHTML = "Todos os dados devem ser preenchidos";
              return false;
          }
          else {

          console.log("FORM LOGIN: ", emailVar);
          console.log("FORM SENHA: ", senhaVar);

          fetch("/usuarios/autenticar", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({
                  emailServer: emailVar,
                  senhaServer: senhaVar
              })
          }).then(function (resposta) {
              console.log("ESTOU NO THEN DO entrar()!")

              if (resposta.ok) {
                  console.log(resposta);

                  resposta.json().then(json => {
                      console.log(json);
                      console.log(JSON.stringify(json));
                      sessionStorage.EMAIL_USUARIO = json.email;
                      sessionStorage.NOME_USUARIO = json.nome;
                      sessionStorage.ID_USUARIO = json.id;
                      sessionStorage.COLECAO = json.colecao;
                      
                      error_message.innerHTML = "Seja bem vindo! Redirecionando para a dashboard...";
                      setTimeout(function () {
                          window.location = "collection.html";
                      }, 1000); // apenas para exibir o loading
                  });

              } else {
                  error_message.innerHTML = "Conta não encontrada"
                  console.log("Houve um erro ao tentar realizar o login!");
              }

          }).catch(function (erro) {
              console.log(erro);
          })

          return false;
      }
    }
</script>
</html>
